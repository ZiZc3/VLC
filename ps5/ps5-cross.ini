# meson cross file: the PS5 as the host machine (FreeBSD-derived, x86-64).
# Adapted from Mihawk-99's PS5_Vulkan tooling/radv/ps5-cross.ini (GPL-3.0-or-later).
# The SDK root and this directory come from a generated constants file (deps/build-deps.sh).

[binaries]
c = sdk / 'bin/prospero-clang'
cpp = sdk / 'bin/prospero-clang++'
ar = sdk / 'bin/prospero-ar'
strip = sdk / 'bin/prospero-strip'
# Not the SDK's prospero-pkg-config: it replaces PKG_CONFIG_LIBDIR with its own.
pkg-config = ps5 / 'pkg-config'

[host_machine]
system = 'freebsd'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
default_library = 'static'

[properties]
needs_exe_wrapper = true
